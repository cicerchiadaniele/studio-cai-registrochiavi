<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8B1538" />
    <title>Registro Chiavi – Studio CAI</title>
    <script>
      // Chiede subito l'elenco, in parallelo al download dell'app: prima Airtable diretto (/api/elenco),
      // se non disponibile il webhook Make.
      (function () {
        if (location.pathname.replace(/\/$/, '') === '/cartello') return
        try {
          var testo = function (r) { return r.ok ? r.text() : null }
          var valido = function (t) { try { return t && JSON.parse(t).ok === true ? t : null } catch (e) { return null } }
          var make = function () {
            return fetch('__WEBHOOK_URL__', {
              method: 'POST',
              body: new URLSearchParams({ azione: 'elenco', versione: '__APP_VERSION__' }),
            }).then(testo).catch(function () { return null })
          }
          window.__elenco = fetch('/api/elenco', { cache: 'no-store' })
            .then(testo).then(valido).catch(function () { return null })
            .then(function (t) { return t || make() })
        } catch (e) { window.__elenco = null }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
